name: Deploy Static Dashboards to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files and security hygiene
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "dashboard_ejecutivo_evm.html"
            "dashboard_project_management.html"
            "logo_mantilla_gil.png"
            ".nojekyll"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          if [ -d ".claude" ] || [ -f ".env" ]; then
            echo "::error::Sensitive or local tooling files must not be tracked in the repository."
            exit 1
          fi

          for html in index.html dashboard_ejecutivo_evm.html dashboard_project_management.html; do
            if ! grep -qi "<!doctype html>" "$html"; then
              echo "::error::Invalid HTML document (missing doctype): $html"
              exit 1
            fi
          done

          echo "All static asset validations passed."

      - name: Assemble clean static bundle
        run: |
          mkdir -p _site
          cp index.html _site/
          cp dashboard_ejecutivo_evm.html _site/
          cp dashboard_project_management.html _site/
          cp logo_mantilla_gil.png _site/
          cp .nojekyll _site/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
